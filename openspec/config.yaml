schema: spec-driven

context: |
  nebula is one Go binary. The command is nebula.
  sql, s3, run, tunnel, crypt, and auth are features of that binary,
  selected by subcommand or by argv0.
  crypt reads and writes 1Password items. auth signs in with one shared
  Google client whose id and secret stay in 1Password. c3po tui pass
  reaches 1Password through nebula crypt and does not call op.
  sql talks to Postgres on the SSH host. It does not hold application
  records. Each app keeps its own sqlite and backs that file up with s3.
  s3 stores objects with s3:// URIs.
  run builds a site on the laptop and serves it on 127.0.0.1 of the SSH
  host behind one free hostname. It does not migrate a database.
  tunnel publishes laptop ports through the laptop Cloudflare tunnel.
  Env names SQLX_* and S3X_* stay. The runtime directory name is sqlx.
  Object buckets are sqlx and sqlx-backups. The remote directory is
  /var/lib/nebula/s3x.

rules:
  proposal:
    - State the operator problem, outcome, scope, and non-goals.
  specs:
    - Use SHALL or MUST and concrete GIVEN/WHEN/THEN scenarios.
  tasks:
    - Include strict OpenSpec validation and the relevant Go tests.
    - Mark a task complete only after the check has been run.
